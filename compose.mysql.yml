# MySQL topology.
#
#   docker compose -f compose.yml -f compose.mysql.yml up -d
#
# The FlowCMS image is unchanged. Garage and Redis are unaffected.

services:
  app:
    environment:
      DATABASE_DIALECT: mysql
      DATABASE_URL: mysql://${MYSQL_USER:-flowcms}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-flowcms}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # utf8mb4 explicitly, never the legacy 3-byte `utf8`, which cannot store
    # emoji or many CJK characters and would silently mangle post content.
    #
    # The collation is case-INSENSITIVE (MySQL's default family), and FlowCMS
    # does not depend on that either way: email identity is normalised in the
    # application, so `User@…` and `user@…` are one account on all four engines
    # regardless of what the server would have decided.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flowcms}
      MYSQL_USER: ${MYSQL_USER:-flowcms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # No published port.

volumes:
  mysql-data:
