# ---------------------------------------------------------------------------
# Release.
#
# THE RELEASE PATH. `flowcms` and `create-flowcms` are published; this file is
# how every version after 0.1.0 reaches the registry, and it is deliberately
# hard to trigger by accident.
#
# CURRENT FACTS, so nobody re-derives them from a stale comment:
#
#   licence                GPL-2.0-or-later, in LICENSE and in both manifests
#   repository             PUBLIC, github.com/flowcms-tech/flowcms
#   repository metadata    repository/bugs/homepage present in both manifests
#   npm                    flowcms and create-flowcms are BOTH PUBLISHED at
#                          0.1.0. Every npm version is immutable; this workflow
#                          refuses to republish one that already exists.
#   git tag                v0.1.0 exists and is IMMUTABLE. A published version's
#                          tag is what provenance and every consumer resolve
#                          back to. Never move, delete or recreate it.
#   GitHub Release         created by this workflow, last, after both publishes
#                          succeed. Its notes are the changelog section for the
#                          version, not the whole file
#   npm auth               NO PUBLISH CREDENTIAL IN THIS FILE, at any scope
#                          within it. Publication authenticates through npm
#                          Trusted Publishing: the npm CLI exchanges this job's
#                          GitHub OIDC identity for a short-lived, single-use
#                          credential. Adding a publish token back would be a
#                          regression, not a convenience.
#   Trusted Publishing     configured on npm for BOTH packages, and bound to
#                          this repository, THIS workflow FILENAME, and the
#                          `npm-publish` environment. Renaming this file, or
#                          publishing from a different workflow or environment,
#                          breaks that binding and the registry refuses.
#
# WHAT MAKES A PUBLICATION HAPPEN — all four, together:
#
#   1. This workflow is dispatched. A tag push runs the proof tiers and nothing
#      else; an ordinary push to main does not run this file at all.
#   2. `publish: true` on that dispatch.
#   3. `confirm` matching the exact phrase the job checks.
#   4. The `npm-publish` GitHub environment lets the job start, which is where
#      required reviewers belong.
#
# WHO SUPPLIES 1-3 CHANGED, and this file did not. They used to be typed by a
# maintainer at the Actions UI. `release-on-merge.yml` now supplies them
# automatically when a merge to main carries a version with no tag yet — that
# is, when the release pull request is merged. Every gate below is unchanged
# and still applies to that dispatch exactly as it applied to a typed one: the
# run must be on a tag that names the version in the manifests, the registry
# must not already hold that version, and the tiers must be green.
#
# WHAT THAT LEAVES AS THE HUMAN GATE. Gate 4, and only gate 4. Merging the pull
# request is the decision; the `npm-publish` environment's required reviewer is
# the last point at which it can be stopped. Removing that reviewer makes
# merging the pull request sufficient on its own — a real choice, not an
# oversight, and worth making knowingly.
#
# And then, per package, `prepublishOnly` -> publish-guard.mjs validates the
# licence, the repository metadata and the built artifacts before npm sends
# anything. Those guards no longer refuse unconditionally — they refuse unless
# FLOWCMS_RELEASE=1, which only the publish steps below set.
#
# ORDER: `flowcms` first, then `create-flowcms`. Not because a generated
# project needs the registry copy — it vendors its own, by decision — but
# because the scaffolder ships documentation pointing theme authors at a
# package that would otherwise not exist. The second step does not run if the
# first fails.
#
# PROVENANCE: `--provenance` needs a public repository, a GitHub-hosted runner,
# `id-token: write`, and manifest `repository` metadata. All four hold. It
# cannot be added to a version after that version is published. Trusted
# Publishing would attach provenance on its own; the flag stays explicit so the
# intent survives a change in that default.
#
# WHAT THIS FILE REFUSES: publishing a version that is already on the registry,
# publishing from anything other than the tag that names that version, and
# publishing on any answer from the registry it cannot interpret. See the
# release-target preflight in the publish job.
#
# This file performs no version bumping, and it reads the changelog only to cut
# one section out of it for the release notes. Creating the tag is somebody
# else's job: `release-on-merge.yml` does it on the merge that moves the
# version, and this workflow refuses to run against anything but a tag that
# already exists and names the version in the manifests.
# ---------------------------------------------------------------------------
name: Release

on:
  # A tag push runs the proof tiers. It CANNOT publish: the publish job is
  # gated on workflow_dispatch inputs, which a tag push does not supply.
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm (requires the confirmation phrase below)"
        type: boolean
        default: false
      confirm:
        description: "Type PUBLISH FLOWCMS to confirm. Any other value refuses."
        type: string
        default: ""

# Read-only for the whole file. Only the publish job asks for more, and it asks
# in its own `permissions:` block rather than raising the default for every job
# that merely runs tests.
permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # The full proof. Each of these is the same file the PR and main tiers use —
  # called, not copied, so a gate cannot pass on main and be absent here.
  # -------------------------------------------------------------------------
  ci:
    name: CI tier
    uses: ./.github/workflows/ci.yml

  databases:
    name: Database tier
    uses: ./.github/workflows/database-matrix.yml
    with:
      # The one place the compose topology matrix is not optional. A release is
      # exactly when "does a real deployment of this survive being operated?"
      # has to have been asked of all four engines.
      topology: true

  consumers:
    name: Consumer tier
    uses: ./.github/workflows/consumer-proofs.yml
    with:
      # `full` tells it the deep proof is running elsewhere: docker.yml below
      # runs the SAME script including its image build, so the shallow
      # `--no-docker` leg would only pay for the fast half a second time.
      full: true

  docker:
    name: Docker tier
    uses: ./.github/workflows/docker.yml
    with:
      # Depth is passed as an INPUT, never inferred from the event. Inside a
      # called workflow `github.event_name` is the CALLER's event, so a release
      # cut from a `v*` tag looks exactly like an ordinary push to main — and
      # every expensive leg guarded by an event check would skip itself during
      # the one run that must not skip anything.
      full: true

  portability:
    name: Portability tier
    uses: ./.github/workflows/portability.yml
    with:
      # Windows and macOS suites, the cross-platform scaffold proof, and the
      # pnpm/yarn/bun matrix. A release is the point at which
      # docs/distribution/package-managers.md's support levels either have
      # evidence behind them or do not.
      full: true

  # -------------------------------------------------------------------------
  release-proof:
    name: Release proof summary
    runs-on: ubuntu-24.04
    needs: [ci, databases, consumers, docker, portability]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # `scripts/release-proof.mjs` is the canonical, ordered list of what a
      # release must prove (Phase 8.5). Its DEFAULT mode prints the plan and
      # runs nothing, which is exactly what is wanted here: the jobs above have
      # already run those stages in parallel, and re-running the orchestrator
      # serially would pay for all of it a second time over tens of minutes.
      #
      # Printing the plan into the run summary is what keeps the two from
      # drifting invisibly — a stage added to the script but not to a tier above
      # shows up in the summary of every release with nothing beside it.
      # Nothing here executes a stage; there is no `--execute`.
      - name: The canonical release-proof plan (printed, not executed)
        run: |
          {
            echo "## Release-proof plan (scripts/release-proof.mjs)"
            echo
            echo "Printed, not executed. The stages below ran as the parallel"
            echo "tiers of this workflow. Any stage listed here with no"
            echo "corresponding tier above is a gap."
            echo
            echo '```'
            node scripts/release-proof.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preconditions the packages carry themselves
        run: |
          set -e
          fail=0
          # The two intended packages must be publishable AND still guarded.
          for pkg in packages/flowcms packages/create-flowcms; do
            if [ ! -f "$pkg/publish-guard.mjs" ]; then
              echo "::error::$pkg/publish-guard.mjs is missing - the release-safety validation is gone"
              fail=1
            fi
            if ! grep -q 'prepublishOnly' "$pkg/package.json"; then
              echo "::error::$pkg/package.json no longer runs its publish guard"
              fail=1
            fi
            if grep -q '"private": true' "$pkg/package.json"; then
              echo "::error::$pkg/package.json is private - npm would refuse to publish it"
              fail=1
            fi
          done
          # The packages that must NEVER be published must still be private.
          for pkg in . packages/flowcms-theme-aurora; do
            if ! grep -q '"private": true' "$pkg/package.json"; then
              echo "::error::$pkg/package.json is no longer private, and it is not a publish target"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "publish targets are guarded and publishable; non-targets are still private"

      - name: Summary
        run: |
          {
            echo "## FlowCMS release proof"
            echo
            echo "Every gate in the pipeline ran: static analysis, the test suite,"
            echo "artifact hygiene, the four-engine database matrix including the"
            echo "compose topology legs, both clean-consumer proofs, the Docker"
            echo "image build and runtime smoke, the Windows and macOS suites, the"
            echo "cross-platform scaffold proof, and the pnpm/yarn/bun matrix."
            echo
            echo "Read the SKIPPED jobs as carefully as the failed ones: a depth"
            echo "input that did not arrive shows up as a green run that proved"
            echo "less than it looks like it did."
            echo
            echo "**This proof does not publish anything.** Publication happens only"
            echo "on a dispatch of this workflow with publish: true and the"
            echo "confirmation phrase, and only through the npm-publish environment."
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # THE PUBLISH JOB.
  #
  # Reachable only by a workflow_dispatch that sets `publish: true` AND supplies
  # the confirmation phrase. A tag push supplies neither input, so it runs the
  # proof tiers above and stops. An ordinary push to main does not trigger this
  # file at all — `release-on-merge.yml` is what watches main, and all it can do
  # is perform this same dispatch against a tag it created.
  #
  # The `npm-publish` environment is the fourth gate, and the one that belongs
  # to a person rather than to this file: configure it with required reviewers.
  # It is also half of the npm trust binding, so it is not merely policy here —
  # removing it would stop the registry accepting the publish at all.
  # -------------------------------------------------------------------------
  publish:
    name: npm publish (Trusted Publishing)
    runs-on: ubuntu-24.04
    needs: [release-proof]
    if: ${{ inputs.publish && inputs.confirm == 'PUBLISH FLOWCMS' }}
    environment: npm-publish
    permissions:
      # THE ELEVATED PERMISSIONS, scoped to this job.
      #
      # `contents: write` exists for exactly one step: `gh release create` at
      # the end of this job. It arrived in the same commit that enabled that
      # step, which is the rule `tests/ci/workflowPolicy.test.ts` enforces in
      # both directions — the permission and the capability that justifies it
      # cannot move independently. If that step is ever disabled again, this
      # goes back to `read` in the same commit.
      #
      # It is NOT what publishes. Nothing on the registry path reads this
      # token; the publish authenticates through OIDC below and holds no
      # credential of its own.
      contents: write
      # OIDC. This is now load-bearing twice over: it is what npm Trusted
      # Publishing exchanges for a publish credential, AND what provenance
      # signs with. Without it there is no way to authenticate at all — which
      # is the intended shape: this job holds no long-lived credential of its own.
      id-token: write
    steps:
      # Checkout is FIRST because every gate below reads the repository. A
      # precondition that runs before checkout cannot see the manifests it
      # claims to be checking, and reports their absence as a metadata defect.
      - name: Checkout
        uses: actions/checkout@v5

      # ---------------------------------------------------------------------
      # RELEASE_PRECONDITIONS
      #
      # Deliberately UNCONDITIONAL, and the first thing after checkout. It
      # asserts the ORDERING facts a green pipeline cannot tell you about: the
      # repository is public before a provenance publish, and the manifests
      # carry the `repository` field that provenance resolves and npm renders
      # as the package's source link.
      # ---------------------------------------------------------------------
      - name: RELEASE_PRECONDITIONS
        run: |
          set -e
          fail=0
          # Fails CLOSED: an absent or unexpected value is not read as public.
          private="${{ github.event.repository.private }}"
          if [ "$private" != "false" ]; then
            echo "::error::repository visibility reads '$private' where 'false' (public) is required. npm provenance requires a public source repository and is refused rather than downgraded"
            fail=1
          fi
          for pkg in packages/flowcms packages/create-flowcms; do
            if ! grep -q '"repository"' "$pkg/package.json"; then
              echo "::error::$pkg/package.json carries no repository field - provenance resolves it, and npm renders it as the only visible link to the source"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "release preconditions hold: public repository, repository metadata present"

      # SET UP NODE, AND NOTHING ELSE.
      #
      # `registry-url:` is deliberately absent, and its absence is a security
      # property rather than a simplification. That input does not merely select
      # a registry: setup-node writes an npmrc containing an auth entry for that
      # registry keyed to an environment variable, and points npm at that file.
      # With Trusted Publishing nothing ever sets that variable, so npm reads a
      # registry it believes is already configured for classic token auth —
      # which is precisely the state in which it does not begin the OIDC
      # exchange, and fails with ENEEDAUTH or E404 instead. The registry is
      # therefore selected in its own step below, by the one key that selects
      # it and nothing more.
      #
      # `package-manager-cache: false` because this is the privileged job. A
      # restored cache is attacker-influenceable input from earlier runs, and
      # this job is the one that signs and publishes; it can afford a cold
      # install. Every other workflow keeps its cache.
      #
      # The project's Node line is 22 and stays 22. `"22"` resolves to the
      # latest 22.x, which clears both the npm CLI's engine range and Trusted
      # Publishing's Node floor.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      # ---------------------------------------------------------------------
      # THE PUBLIC REGISTRY, CHOSEN WITHOUT A CREDENTIAL.
      #
      # One config key, the one that selects a registry. No auth entry, no
      # token variable, no `npm login`, no `npm adduser`. That is what leaves
      # the OIDC exchange as the only way this job can authenticate at all: npm
      # finds no configured credential for the registry, so it asks GitHub for
      # an identity token and trades it with npm for a short-lived one.
      #
      # Set AND asserted. A `set` that silently did not take effect, or a
      # user-level config that redirects publication elsewhere, has to fail the
      # job rather than quietly send the packages to another registry. This runs
      # before the CLI is pinned so that even the npm download comes from the
      # registry this workflow chose.
      # ---------------------------------------------------------------------
      - name: Target the public npm registry
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          effective="$(npm config get registry)"
          if [ "$effective" != "https://registry.npmjs.org/" ]; then
            echo "::error::npm resolves its registry to '$effective', not https://registry.npmjs.org/. Refusing to publish to a registry this workflow did not choose."
            exit 1
          fi
          echo "registry: $effective"

      # ---------------------------------------------------------------------
      # THE CLIENT THAT PERFORMS THE OIDC EXCHANGE.
      #
      # Trusted Publishing is done by the npm CLI, not by this workflow: it
      # needs 11.5.1 or newer, and the npm bundled with Node 22 is older. So the
      # client is installed explicitly and PINNED TO AN EXACT VERSION. Never
      # `npm@latest` — a release path whose credential exchange comes from
      # whatever npm published this morning is not a release path.
      #
      # This is the only `npm install` in this file, and it installs the package
      # manager rather than the project's dependencies; project dependencies are
      # still `npm ci` below. The CI policy suite pins that narrowness: exactly
      # this package, an exact version, at or above the Trusted Publishing
      # floor, and only here.
      # ---------------------------------------------------------------------
      - name: Pin the npm CLI that performs the OIDC exchange
        run: |
          set -euo pipefail
          npm install -g npm@11.19.0
          installed="$(npm --version)"
          if [ "$installed" != "11.19.0" ]; then
            echo "::error::npm reports $installed after pinning 11.19.0. The publish would run its credential exchange on an unknown client, so it is refused."
            exit 1
          fi
          echo "npm CLI: $installed (node $(node --version))"

      # ---------------------------------------------------------------------
      # RELEASE-TARGET PREFLIGHT.
      #
      # This replaced a first-publication gate that asked "are these names
      # still free?" and refused on HTTP 200. Both packages exist now, so that
      # question inverted: a 200 is the healthy answer, and a 404 would mean
      # the name, the registry or this workflow is wrong.
      #
      # What has to be true before a version is published, permanently:
      #
      #   - the registry is reachable AND answering coherently
      #   - both package names exist on it
      #   - both local manifests carry the names this workflow publishes
      #   - both local manifests carry the SAME version
      #   - this run is on a tag, and that tag is exactly v<version>
      #   - neither package already has that version
      #
      # It FAILS CLOSED throughout, which is the whole point. An unexpected
      # status, malformed metadata, a thrown request, two packages disagreeing
      # about the version — every ambiguous state refuses. The failure mode
      # being designed against is the cheerful one: a check that reads a DNS
      # failure, a proxy, or an outage as permission to proceed.
      #
      # The positive control is what makes the other answers mean anything. A
      # captive proxy answering the same thing to everything would otherwise be
      # indistinguishable from the registry agreeing with us.
      #
      # npm versions are immutable, so "already published" is not a warning to
      # be overridden: bump the version and cut a new tag. In particular this is
      # why v0.1.0 is never re-cut.
      #
      # Public, unauthenticated reads. No credential is in this step's
      # environment, and none is needed to read public metadata.
      # ---------------------------------------------------------------------
      - name: Release-target preflight (fail-closed)
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { readFileSync } = require('node:fs');

          const REGISTRY = 'https://registry.npmjs.org';
          const CONTROL = 'react';
          const TARGETS = [
            { dir: 'packages/flowcms', name: 'flowcms' },
            { dir: 'packages/create-flowcms', name: 'create-flowcms' },
          ];
          const SEMVER = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          const trimSlash = (url) => String(url).replace(/\/+$/, '');

          // Abbreviated metadata: the smallest response that still carries the
          // package name and its full version list. No credentials attached.
          async function packument(name) {
            const response = await fetch(`${REGISTRY}/${encodeURIComponent(name)}`, {
              method: 'GET',
              redirect: 'follow',
              headers: { accept: 'application/vnd.npm.install-v1+json' },
              signal: AbortSignal.timeout(15000),
            });
            if (response.status !== 200) return { status: response.status, body: null };
            try {
              return { status: 200, body: await response.json() };
            } catch {
              return { status: 200, body: null };
            }
          }

          (async () => {
            const die = (message) => {
              console.log(`::error::${message}`);
              process.exit(1);
            };
            let refused = false;
            const refuse = (message) => {
              console.log(`::error::${message}`);
              refused = true;
            };

            // --- 1. The manifests say what this workflow thinks they say ----
            const local = [];
            for (const target of TARGETS) {
              let manifest;
              try {
                manifest = JSON.parse(readFileSync(`${target.dir}/package.json`, 'utf8'));
              } catch (error) {
                die(`${target.dir}/package.json could not be read as a manifest (${error.message}). A release does not proceed on a manifest nobody can parse.`);
              }
              if (manifest.name !== target.name) {
                die(`${target.dir}/package.json declares the name '${manifest.name}', but this workflow publishes '${target.name}'. Publishing would land on the wrong package.`);
              }
              if (typeof manifest.version !== 'string' || !SEMVER.test(manifest.version)) {
                die(`${target.dir}/package.json carries the version ${JSON.stringify(manifest.version)}, which is not a plain semver version. Ambiguous state refuses.`);
              }
              // `publishConfig.registry` outranks the registry configured for
              // the job, so it is the one remaining way a manifest could send a
              // package somewhere this workflow did not choose. Absent is fine;
              // present and different is not.
              const pinned = manifest.publishConfig?.registry;
              if (pinned !== undefined && trimSlash(pinned) !== trimSlash(REGISTRY)) {
                die(`${target.dir}/package.json pins publishConfig.registry to ${JSON.stringify(pinned)}, which would publish somewhere other than ${REGISTRY}.`);
              }
              local.push({ ...target, version: manifest.version });
            }

            const versions = [...new Set(local.map((target) => target.version))];
            if (versions.length !== 1) {
              die(`the publishable packages disagree about the version: ${local.map((t) => `${t.name}@${t.version}`).join(', ')}. They are released together and must carry the same version.`);
            }
            const version = versions[0];
            console.log(`local release version: ${version}`);

            // --- 2. This run is on the tag that names that version ----------
            const refType = process.env.GITHUB_REF_TYPE;
            const refName = process.env.GITHUB_REF_NAME;
            const expected = `v${version}`;
            if (refType !== 'tag') {
              die(`this run is on a ${refType} ('${refName}'), not a tag. Publication is dispatched against the release tag ${expected}, so that what reaches the registry is exactly what the tag names.`);
            }
            if (refName !== expected) {
              die(`this run is on the tag '${refName}', but the packages are at ${version}, whose tag is '${expected}'. Refusing to publish a version its tag does not name.`);
            }
            console.log(`release tag: ${refName} names ${version}`);

            // --- 3. The registry is reachable and coherent ------------------
            let control;
            try {
              control = await packument(CONTROL);
            } catch (error) {
              die(`the registry could not be reached at all: the positive-control request for '${CONTROL}' threw (${error.name}: ${error.message}). Every answer below would be meaningless, so publication is refused rather than guessed at.`);
            }
            if (control.status !== 200 || control.body?.name !== CONTROL) {
              die(`the positive-control request for '${CONTROL}' answered HTTP ${control.status} describing ${JSON.stringify(control.body?.name)}. Something between this runner and the registry is not answering coherently, so nothing it says about our packages can be trusted.`);
            }
            console.log(`positive control: ${CONTROL} -> HTTP 200, coherent metadata`);

            // --- 4. Both packages exist, neither has this version yet -------
            for (const target of local) {
              let result;
              try {
                result = await packument(target.name);
              } catch (error) {
                refuse(`the metadata request for '${target.name}' threw (${error.name}: ${error.message}). A failed request is not evidence that publishing is safe.`);
                continue;
              }
              if (result.status === 404) {
                refuse(`the registry has no package called '${target.name}'. Both packages are published, so a 404 means the name, the registry or this workflow is wrong - it is not an invitation to create it.`);
                continue;
              }
              if (result.status !== 200) {
                refuse(`the registry answered HTTP ${result.status} for '${target.name}'. Only a coherent 200 counts as an answer; everything else refuses.`);
                continue;
              }
              const body = result.body;
              if (body === null || body.name !== target.name || typeof body.versions !== 'object' || body.versions === null) {
                refuse(`the registry's metadata for '${target.name}' is malformed, or describes a different package. Refusing to reason about it.`);
                continue;
              }
              if (Object.prototype.hasOwnProperty.call(body.versions, version)) {
                refuse(`${target.name}@${version} is ALREADY PUBLISHED. npm versions are immutable: bump the version and cut a new tag rather than attempting to republish this one.`);
                continue;
              }
              console.log(`${target.name}: exists, ${Object.keys(body.versions).length} published version(s), ${version} is not among them`);
            }

            if (refused) process.exit(1);
            console.log(`preflight passed: publishing ${version} from ${refName}`);
          })();
          NODE

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the publishable artifacts
        run: |
          npm run build:packages
          npm run build:template

      - name: Artifact hygiene, immediately before publishing
        run: node scripts/verify-artifact-hygiene.mjs

      # ---------------------------------------------------------------------
      # PUBLISH. Order matters: flowcms first. If it fails the job stops and
      # create-flowcms is never attempted - a scaffolder on the registry whose
      # documentation points at a package that is not there is worse than
      # neither being published.
      #
      # THERE IS NO PUBLISH TOKEN HERE, and its absence is the mechanism rather
      # than an omission. The npm CLI exchanges this job's GitHub OIDC identity
      # for a short-lived, single-use credential — which is what `id-token:
      # write` above is for, and why no auth-token variable is set anywhere.
      #
      # npm binds that trust to this repository, this workflow FILENAME and the
      # `npm-publish` environment. Renaming this file, or moving publication to
      # another workflow or environment, is refused by the registry itself and
      # not merely by policy written here.
      #
      # FLOWCMS_RELEASE=1 tells each package's publish-guard that a real release
      # is in progress. The guard still runs every one of its checks.
      # ---------------------------------------------------------------------
      - name: Publish flowcms
        working-directory: packages/flowcms
        env:
          FLOWCMS_RELEASE: "1"
        run: npm publish --provenance --access public

      - name: Publish create-flowcms
        working-directory: packages/create-flowcms
        env:
          FLOWCMS_RELEASE: "1"
        run: npm publish --provenance --access public

      # ---------------------------------------------------------------------
      # The GitHub Release. ENABLED, together with the `contents: write` this
      # step is the sole justification for — the two moved in one commit, which
      # is what `tests/ci/workflowPolicy.test.ts` requires of them.
      #
      # LAST, and deliberately so. The registry is the irreversible half: a
      # published version cannot be taken back, while a GitHub Release can be
      # edited or deleted. Creating it after both publishes means a release
      # page never describes a version that failed to reach the registry, and
      # the failure mode if this step is the one that breaks is a missing page
      # rather than a lying one.
      #
      # THE NOTES ARE ONE SECTION, not the file. `--notes-file CHANGELOG.md`
      # was the placeholder here and it would have attached the entire history
      # — every release back to 0.1.0 — to every release page.
      # ---------------------------------------------------------------------
      - name: Extract this version's changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          const version = process.env.TAG.replace(/^v/, '');
          const changelog = readFileSync('CHANGELOG.md', 'utf8');

          // From this version's heading to the next `## ` heading, whichever it
          // is. Anchored on the heading rather than on a line count, because the
          // sections are of wildly different lengths.
          const start = new RegExp(`^## \\[${version.replace(/\./g, '\\.')}\\][^\\n]*$`, 'm');
          const at = changelog.search(start);
          if (at === -1) {
            console.log(`::error::CHANGELOG.md has no "## [${version}]" section, so this release would have no notes. The tag and the manifests agree on the version, so what is missing is the changelog entry.`);
            process.exit(1);
          }
          const rest = changelog.slice(at);
          const next = rest.slice(1).search(/^## /m);
          const section = (next === -1 ? rest : rest.slice(0, next + 1)).trimEnd();

          writeFileSync('RELEASE_NOTES.md', `${section}\n`);
          console.log(`${section.split('\n').length} lines of notes for ${version}.`);
          NODE

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `--verify-tag` refuses to create the tag as a side effect: by this
          # point the tag exists and is what was published from, and a release
          # that invented its own would name a different commit.
          gh release create "$TAG" \
            --verify-tag \
            --title "FlowCMS ${TAG#v}" \
            --notes-file RELEASE_NOTES.md
